[project]
name = "dermsemble"
version = "2.0.0"
description = "Dermsemble: Dual-Architecture Deep Ensembling & Production Edge Deployment for Clinical Dermatological Triage"
readme = "README.md"
authors = [
    { name = "varunchandra10", email = "kvarunchandra19@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "onnx>=1.23.2",
    "onnxruntime>=1.24.3",
    "opencv-python>=5.0.0.93",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.2.0",
]

[project.scripts]
btech-project = "btech_project:main"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
